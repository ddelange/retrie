# Config lives here rather than in pyproject.toml because this project still ships setup.py for Python 2.7.
# target-version is the lowest ruff supports; the package itself supports Python 2.7, so no pyupgrade (UP) or future-annotations (FA) rules.
target-version = "py37"
line-length = 88
output-format = "concise"

[lint]
select = [
  "A", # flake8-builtins
  "B", # flake8-bugbear, covers flake8-mutable
  "C4", # flake8-comprehensions
  "E", # pycodestyle errors
  "F", # pyflakes
  "G", # flake8-logging-format
  "I", # isort
  "N", # pep8-naming
  "PT", # flake8-pytest-style
  "Q", # flake8-quotes
  "T20", # flake8-print
  "W", # pycodestyle warnings
]
ignore = [
  "E501", # ruff format handles line length
  "B904", # `raise ... from` is Python 3 only
]

[lint.extend-per-file-ignores]
"docs/**/*.py" = [
  "B008", # sphinx config computes defaults from module level constants on purpose
]

[lint.isort]
known-first-party = ["tests"]

[lint.pydocstyle]
convention = "google"
