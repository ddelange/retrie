repos:
-   repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
    -   id: ruff-check
        args: ['--fix', '--exit-non-zero-on-fix']
    # markdown only: ruff format explodes the per-argument `# type:` comment signatures in src/
    # into a trailing comma after *args, which is a SyntaxError on python 2.7, so black keeps the .py files
    -   id: ruff-format
        files: \.md$

-   repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
    -   id: black

-   repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
    -   id: detect-secrets
        args: ['--baseline', '.secrets.baseline']
        exclude: .*/tests/.*

-   repo: local
    hooks:
    -   id: mypy
        name: Run mypy
        entry: python -m mypy src/
        language: system
        types: [python]
        pass_filenames: false

-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
    -   id: mixed-line-ending
        args: ['--fix=lf']
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-merge-conflict
    -   id: check-json
    -   id: check-toml
    -   id: check-xml
    -   id: check-yaml
    -   id: debug-statements

-   repo: https://github.com/econchick/interrogate
    rev: 1.7.0
    hooks:
    -   id: interrogate
        pass_filenames: false
        args: [-c, setup.cfg]
        additional_dependencies: ['setuptools']  # setuptools for pkg_resources for python 3.12

-   repo: https://github.com/python-jsonschema/check-jsonschema
    rev: 0.38.0
    hooks:
    -   id: check-dependabot
    -   id: check-github-workflows
